<!doctype html>
<html lang="en-US" data-locale-pending="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmic Gemini</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <div class="identity">
      <span class="brand-mark" aria-hidden="true"><img class="brand-icon" src="icons/icon-128.png" alt=""></span>
      <strong data-i18n="appName">Cosmic Gemini</strong>
    </div>
    <div class="feature-list">
      <section class="feature-row standard-row" data-feature="nativeScroll">
        <span class="feature-status" id="nativeScroll-status" aria-hidden="true"></span>
        <nav class="actions" data-i18n-aria-label="nativeScrollName">
          <button class="icon-button" data-action="power" type="button"></button>
          <button class="icon-button dependent" data-action="enhanced" type="button"></button>
          <button class="icon-button dependent" data-action="whitelist" type="button"></button>
          <button class="icon-button" data-action="settings" type="button"></button>
        </nav>
      </section>
      <section class="feature-row standard-row" data-feature="noAutoplay">
        <span class="feature-status" id="noAutoplay-status" aria-hidden="true"></span>
        <nav class="actions" data-i18n-aria-label="noAutoplayName">
          <button class="icon-button" data-action="power" type="button"></button>
          <button class="icon-button dependent" data-action="enhanced" type="button"></button>
          <button class="icon-button dependent" data-action="whitelist" type="button"></button>
          <button class="icon-button" data-action="settings" type="button"></button>
        </nav>
      </section>
      <section class="feature-row launcher-row">
        <nav class="launcher-actions" data-i18n-aria-label="quickToolsLabel">
          <button class="feature-status feature-toggle" id="anyCopy-status" type="button"></button>
          <button class="feature-status feature-toggle" id="anyCopyEnhanced-status" type="button"></button>
          <button class="feature-status feature-toggle" id="imageDownload-status" type="button"></button>
          <button class="feature-status feature-toggle" id="videoDownload-status" type="button"></button>
          <button class="feature-status feature-toggle" id="all-settings" type="button"></button>
        </nav>
      </section>
    </div>
    <span class="sr-only" id="live" aria-live="polite"></span>
  </main>
  <section class="video-panel" id="video-panel" hidden>
    <header class="video-panel-header">
      <button class="icon-button" id="video-back" type="button"></button>
      <div class="video-panel-wordmark"><strong data-i18n="videoDownloadName">Video Download</strong><small><em>at</em> Cosmic Gemini</small></div>
      <button class="icon-button" id="video-stop" type="button"></button>
    </header>
    <div class="video-panel-body">
      <div class="video-status-line">
        <p id="video-status-text"></p>
        <button class="icon-button" id="video-rescan" type="button"></button>
      </div>
      <div id="video-results"></div>
    </div>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
