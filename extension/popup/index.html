<!doctype html>
<html lang="en-US" data-locale-pending="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmic Gemini</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <div class="identity" hidden>
      <span class="brand-mark" aria-hidden="true"><img class="brand-icon" src="../icons/icon-128.png" alt=""></span>
      <strong data-i18n="appName">Cosmic Gemini</strong>
    </div>
    <div class="feature-list">
      <section class="feature-row">
        <nav class="launcher-actions" data-i18n-aria-label="nativeScrollControlsLabel">
          <button class="feature-status feature-toggle primary-product" id="nativeScroll-status" type="button"></button>
          <button class="feature-status feature-toggle secondary-product" id="nativeScroll-enhanced" type="button"></button>
        </nav>
      </section>
      <section class="feature-row">
        <nav class="launcher-actions" data-i18n-aria-label="noAutoplayControlsLabel">
          <button class="feature-status feature-toggle primary-product" id="noAutoplay-status" type="button"></button>
          <button class="feature-status feature-toggle secondary-product" id="noAutoplay-enhanced" type="button"></button>
        </nav>
      </section>
      <section class="feature-row">
        <nav class="launcher-actions" data-i18n-aria-label="anyCopyControlsLabel">
          <button class="feature-status feature-toggle primary-product" id="anyCopy-status" type="button"></button>
          <button class="feature-status feature-toggle primary-product" id="anyCopyEnhanced-status" type="button"></button>
        </nav>
      </section>
      <section class="feature-row">
        <nav class="launcher-actions" data-i18n-aria-label="downloadToolsLabel">
          <button class="feature-status feature-toggle primary-product" id="imageDownload-status" type="button"></button>
          <button class="feature-status feature-toggle primary-product" id="videoDownload-status" type="button"></button>
        </nav>
      </section>
    </div>
    <div class="popup-footer">
      <button class="feature-status utility-control" id="all-settings" type="button"></button>
    </div>
    <span class="sr-only" id="live" aria-live="polite"></span>
  </main>
  <section class="video-panel" id="video-panel" hidden>
    <header class="video-panel-header">
      <button class="icon-button" id="video-back" type="button"></button>
      <div class="video-panel-identity">
        <img class="video-panel-brand" src="../icons/icon-128.png" alt="">
        <span class="video-panel-product-icon" id="video-panel-product-icon" aria-hidden="true"></span>
        <div class="video-panel-wordmark"><strong data-i18n="videoDownloadName">Video Download</strong><small><em>at</em> Cosmic Gemini</small></div>
      </div>
      <button class="icon-button" id="video-stop" type="button"></button>
    </header>
    <div class="video-panel-body">
      <div class="video-status-line">
        <p id="video-status-text"></p>
        <button class="icon-button" id="video-rescan" type="button"></button>
      </div>
      <div id="video-results"></div>
    </div>
  </section>
  <script type="module" src="popup.js"></script>
</body>
</html>
