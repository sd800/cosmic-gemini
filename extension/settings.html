<!doctype html>
<html lang="en-US" data-locale-pending="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Native Scroll · Settings</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand-mark" aria-hidden="true"><img class="brand-icon" src="icons/icon-128.png" alt=""></span>
      <div><strong data-i18n="appName">Native Scroll</strong><span data-i18n="settingsHeading">Settings</span></div>
    </div>
  </header>
  <main class="layout">
    <div class="primary">
      <section class="card">
        <div class="section-heading"><div><h1 data-i18n="protectionHeading">Protection</h1><p data-i18n="globalProtectionHelp"></p></div>
          <label class="switch"><input id="enabled" type="checkbox"><span></span><b class="sr-only" data-i18n="globalProtection">Native Scroll</b></label>
        </div>
        <div class="mode-list">
          <label class="mode-option"><input type="radio" name="mode" value="standard"><span><strong data-i18n="standardMode"></strong><small data-i18n="standardModeHelp"></small></span></label>
          <label class="mode-option"><input type="radio" name="mode" value="strong"><span><strong data-i18n="strongMode"></strong><small data-i18n="strongModeHelp"></small></span></label>
        </div>
      </section>
      <section class="card">
        <h2 data-i18n="whitelistHeading"></h2>
        <p data-i18n="whitelistHelp"></p>
        <form id="whitelist-form" novalidate>
          <input id="rule" type="text" autocapitalize="none" autocomplete="off" spellcheck="false" data-i18n-placeholder="whitelistPlaceholder">
          <button class="primary-button" type="submit" data-i18n="add">Add</button>
        </form>
        <p class="form-message" id="rule-message" aria-live="polite"></p>
        <ul class="rule-list" id="rule-list"></ul>
        <p class="caption" data-i18n="exactRuleHelp"></p>
      </section>
      <section class="card compact">
        <label for="language"><strong data-i18n="languageHeading"></strong><small data-i18n="languageHelp"></small></label>
        <select id="language"><option value="en-US" data-i18n="english"></option><option value="zh-CN" data-i18n="chinese"></option></select>
      </section>
    </div>
    <aside class="help card">
      <h2 data-i18n="helpHeading"></h2>
      <p data-i18n="helpStandard"></p>
      <p data-i18n="helpStrong"></p>
      <p data-i18n="helpIndicator"></p>
      <hr>
      <h2 data-i18n="privacyHeading"></h2>
      <p data-i18n="privacyText"></p>
    </aside>
  </main>
  <footer><span id="version"></span><span>© 2026 Songming.org</span></footer>
  <script type="module" src="settings.js"></script>
</body>
</html>
