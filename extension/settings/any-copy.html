<!doctype html>
<html lang="en-US" data-locale-pending="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmic Gemini · Any Copy</title>
  <script src="../localization-data.js"></script>
  <link rel="stylesheet" href="../ui.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body data-feature="anyCopy">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="product-identity">
        <span class="brand-mark" aria-hidden="true"><img class="brand-icon" src="../icons/icon-128.png" alt=""></span>
        <div class="wordmark"><strong>Any Copy</strong><span><em>at</em> Cosmic Gemini</span></div>
      </div>
      <nav class="feature-switch" aria-label="Cosmic Gemini">
        <a class="feature-link" href="native-scroll.html" data-feature-link="nativeScroll"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="no-autoplay.html" data-feature-link="noAutoplay"><span aria-hidden="true"></span></a>
        <a class="feature-link active" href="any-copy.html" data-feature-link="anyCopy"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="video-download.html" data-feature-link="videoDownload"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="satellites.html" data-feature-link="satellites"><span aria-hidden="true"></span></a>
      </nav>
    </div>
  </header>
  <main class="layout">
    <div class="primary">
      <section class="card">
        <div class="section-heading">
          <div><h1 data-i18n="anyCopyStandardHeading"></h1><p data-i18n="anyCopyActivationHelp"></p></div>
          <span class="context-label" data-i18n="siteActivationLabel"></span>
        </div>
      </section>
      <section class="card rule-card" data-list-section="enforcedRules">
        <h2 data-i18n="enforcedSitesHeading"></h2>
        <p data-i18n="enforcedSitesHelp"></p>
        <form class="rule-form" novalidate><input type="text" autocapitalize="none" autocomplete="off" spellcheck="false" data-i18n-placeholder="rulePlaceholder"><button class="primary-button" type="submit" data-i18n="add"></button></form>
        <p class="form-message" aria-live="polite"></p><ul class="rule-list"></ul><p class="caption" data-i18n="exactRuleHelp"></p>
      </section>
      <section class="card rule-card" data-list-section="enhancedRules">
        <h2 data-i18n="enhancedSitesHeading"></h2>
        <p data-i18n="anyCopyEnhancedSitesHelp"></p>
        <form class="rule-form" novalidate><input type="text" autocapitalize="none" autocomplete="off" spellcheck="false" data-i18n-placeholder="rulePlaceholder"><button class="primary-button" type="submit" data-i18n="add"></button></form>
        <p class="form-message" aria-live="polite"></p><ul class="rule-list"></ul><p class="caption" data-i18n="exactRuleHelp"></p>
      </section>
    </div>
    <div class="sidebar">
      <aside class="help card">
        <h2 data-i18n="helpHeading"></h2>
        <p data-i18n="anyCopyHelpStandard"></p><p data-i18n="anyCopyHelpEnhanced"></p>
        <hr><h2 data-i18n="privacyHeading"></h2><p data-i18n="anyCopyPrivacy"></p>
      </aside>
      <section class="card compact language-card">
        <label for="language"><strong data-i18n="languageHeading"></strong></label>
        <select id="language"><option value="en-US" data-i18n="english"></option><option value="zh-CN" data-i18n="chinese"></option></select>
      </section>
    </div>
  </main>
  <footer><span id="version"></span><span>© 2026 Songming.org</span></footer>
  <script src="preload.js"></script>
  <script type="module" src="page.js"></script>
</body>
</html>
