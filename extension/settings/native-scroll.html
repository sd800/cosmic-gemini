<!doctype html>
<html lang="en-US" data-locale-pending="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmic Gemini · Native Scroll</title>
  <script src="../shared/localization-data.js"></script>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body data-feature="nativeScroll">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="product-identity">
        <span class="brand-mark" aria-hidden="true"><img class="brand-icon" src="../icons/icon-128.png" alt=""></span>
        <div class="wordmark"><strong>Native Scroll</strong><span><em>at</em> Cosmic Gemini</span></div>
      </div>
      <nav class="feature-switch" aria-label="Cosmic Gemini">
        <a class="feature-link active" href="native-scroll.html" data-feature-link="nativeScroll"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="no-autoplay.html" data-feature-link="noAutoplay"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="any-copy.html" data-feature-link="anyCopy"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="image-download.html" data-feature-link="imageDownload"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="video-download.html" data-feature-link="videoDownload"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="satellites.html" data-feature-link="satellites"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="all-settings.html" data-feature-link="allSettings"><span aria-hidden="true"></span></a>
      </nav>
    </div>
  </header>
  <main class="layout">
    <div class="primary">
      <section class="card default-card">
        <div class="section-heading">
          <div><h1 data-i18n="nativeScrollName"></h1><p class="intro-purpose" data-i18n="nativeIntroPurpose"></p><p class="intro-setting" data-i18n="nativeProtectionHelp"></p></div>
          <label class="switch"><input id="enabled" type="checkbox" checked><span></span><b class="sr-only">Native Scroll</b></label>
        </div>
      </section>
      <section class="card grouped-rule-card">
        <div class="group-heading"><h2 data-i18n="websiteExceptionsHeading"></h2><p data-i18n="nativeWebsiteExceptionsHelp"></p></div>
        <div class="rule-grid">
          <section class="rule-panel" data-list-section="enabledRules">
            <h3 data-i18n="enabledSitesHeading"></h3><p data-i18n="nativeEnabledSitesHelp"></p>
            <form class="rule-form" novalidate><input type="text" autocapitalize="none" autocomplete="off" spellcheck="false" data-i18n-placeholder="rulePlaceholder"><button class="primary-button" type="submit" data-i18n="add"></button></form>
            <p class="form-message" aria-live="polite"></p><ul class="rule-list"></ul>
          </section>
          <section class="rule-panel" data-list-section="whitelistRules">
            <h3 data-i18n="disabledSitesHeading"></h3><p data-i18n="nativeDisabledSitesHelp"></p>
            <form class="rule-form" novalidate><input type="text" autocapitalize="none" autocomplete="off" spellcheck="false" data-i18n-placeholder="rulePlaceholder"><button class="primary-button" type="submit" data-i18n="add"></button></form>
            <p class="form-message" aria-live="polite"></p><ul class="rule-list"></ul>
          </section>
        </div>
        <p class="caption group-caption" data-i18n="exactRuleHelp"></p>
      </section>
      <section class="card grouped-rule-card">
        <div class="group-heading"><h2 data-i18n="modeByWebsiteHeading"></h2><p data-i18n="nativeModeByWebsiteHelp"></p></div>
        <div class="rule-grid">
          <section class="rule-panel" data-list-section="enhancedRules">
            <h3 data-i18n="enhancedSitesHeading"></h3><p data-i18n="nativeEnhancedSitesHelp"></p>
            <form class="rule-form" novalidate><input type="text" autocapitalize="none" autocomplete="off" spellcheck="false" data-i18n-placeholder="rulePlaceholder"><button class="primary-button" type="submit" data-i18n="add"></button></form>
            <p class="form-message" aria-live="polite"></p><ul class="rule-list"></ul>
          </section>
          <section class="rule-panel" data-list-section="standardRules">
            <h3 data-i18n="standardSitesHeading"></h3><p data-i18n="nativeStandardSitesHelp"></p>
            <form class="rule-form" novalidate><input type="text" autocapitalize="none" autocomplete="off" spellcheck="false" data-i18n-placeholder="rulePlaceholder"><button class="primary-button" type="submit" data-i18n="add"></button></form>
            <p class="form-message" aria-live="polite"></p><ul class="rule-list"></ul>
          </section>
        </div>
        <p class="caption group-caption" data-i18n="exactRuleHelp"></p>
      </section>
    </div>
    <div class="sidebar">
      <aside class="help card">
        <h2 data-i18n="setupGuideHeading"></h2>
        <ol class="flow-list"><li data-i18n="nativeSetupStepDefault"></li><li data-i18n="nativeSetupStepExceptions"></li><li data-i18n="nativeSetupStepEnhanced"></li></ol>
        <hr><h2 data-i18n="privacyHeading"></h2><p data-i18n="nativePrivacy"></p>
      </aside>
      <section class="card compact language-card">
        <label for="language"><strong data-i18n="languageHeading"></strong></label>
        <select id="language"><option value="en-US" data-i18n="english"></option><option value="zh-CN" data-i18n="chinese"></option></select>
      </section>
    </div>
  </main>
  <footer><span id="version"></span><span>© 2026 Songming.org</span></footer>
  <script src="preload.js"></script>
  <script type="module" src="page.js"></script>
</body>
</html>
