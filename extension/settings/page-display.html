<!doctype html>
<html lang="en-US" data-locale-pending="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmic Gemini · Page Display</title>
  <script src="../shared/localization-data.js"></script>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body data-feature="pageDisplay">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="product-identity">
        <span class="brand-mark" aria-hidden="true"><img class="brand-icon" src="../icons/icon-128.png" alt=""></span>
        <div class="wordmark"><strong>Page Display</strong><span><em>at</em> Cosmic Gemini</span></div>
      </div>
      <nav class="feature-switch" aria-label="Cosmic Gemini">
        <a class="feature-link" href="native-scroll.html" data-feature-link="nativeScroll"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="no-autoplay.html" data-feature-link="noAutoplay"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="any-copy.html" data-feature-link="anyCopy"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="image-download.html" data-feature-link="imageDownload"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="video-download.html" data-feature-link="videoDownload"><span aria-hidden="true"></span></a>
        <a class="feature-link active" href="page-display.html" data-feature-link="pageDisplay"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="satellites.html" data-feature-link="satellites"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="all-settings.html" data-feature-link="allSettings"><span aria-hidden="true"></span></a>
      </nav>
    </div>
  </header>
  <main class="layout">
    <div class="primary">
      <section class="card page-display-master-card">
        <div class="section-heading">
          <div><div class="intro-title"><span data-section-icon="pageDisplay" aria-hidden="true"></span><h1 data-i18n="pageDisplayName"></h1></div><p class="last" data-i18n="pageDisplayDescription"></p></div>
          <label class="switch"><input id="enabled" type="checkbox"><span></span><b class="sr-only">Page Display</b></label>
        </div>
      </section>
      <section class="card page-display-feature-card">
        <div class="section-heading page-display-feature-heading">
          <div><div class="rule-heading"><span data-section-icon="reduceWhitePoint" aria-hidden="true"></span><h2 data-i18n="reduceWhitePointName"></h2></div><p class="last" data-i18n="reduceWhitePointHelp"></p></div>
          <label class="switch"><input id="pageDisplayReduceWhitePointEnabled" type="checkbox"><span></span><b class="sr-only">Reduce White Point</b></label>
        </div>
        <div class="preference-list page-display-strength-list">
          <label class="preference-row" for="reduceWhitePointReduction"><span><strong data-i18n="reduceWhitePointReductionHeading"></strong><small data-i18n="reduceWhitePointReductionHelp"></small></span><span class="range-control"><input id="reduceWhitePointReduction" type="range" min="10" max="80" step="5" value="25"><output id="reduceWhitePointReductionValue" for="reduceWhitePointReduction">25%</output></span></label>
        </div>
      </section>
      <section class="card page-display-feature-card">
        <div class="section-heading page-display-feature-heading">
          <div><div class="rule-heading"><span data-section-icon="greyscale" aria-hidden="true"></span><h2 data-i18n="greyscaleName"></h2></div><p class="last" data-i18n="greyscaleHelp"></p></div>
          <label class="switch"><input id="pageDisplayGreyscaleEnabled" type="checkbox"><span></span><b class="sr-only">Greyscale</b></label>
        </div>
      </section>
    </div>
    <div class="sidebar">
      <aside class="help card">
        <h2 data-i18n="helpHeading"></h2>
        <p data-i18n="pageDisplayHelpEffects"></p><p data-i18n="pageDisplayHelpRestore"></p>
        <hr><h2 data-i18n="privacyHeading"></h2><p data-i18n="pageDisplayPrivacy"></p>
      </aside>
      <section class="card compact language-card">
        <label for="language"><strong data-i18n="languageHeading"></strong></label>
        <select id="language"><option value="en-US" data-i18n="english"></option><option value="zh-CN" data-i18n="chinese"></option></select>
      </section>
    </div>
  </main>
  <footer><span id="version"></span><span>© 2026 Songming.org</span></footer>
  <script src="preload.js"></script>
  <script type="module" src="page.js"></script>
</body>
</html>
