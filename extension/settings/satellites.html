<!doctype html>
<html lang="en-US" data-locale-pending="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmic Gemini · Satellites</title>
  <script src="../shared/localization-data.js"></script>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body data-feature="satellites">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="product-identity">
        <span class="brand-mark" aria-hidden="true"><img class="brand-icon" src="../icons/icon-128.png" alt=""></span>
        <div class="wordmark"><strong>Satellites</strong><span><em>at</em> Cosmic Gemini</span></div>
      </div>
      <nav class="feature-switch" aria-label="Cosmic Gemini">
        <a class="feature-link" href="native-scroll.html" data-feature-link="nativeScroll"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="no-autoplay.html" data-feature-link="noAutoplay"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="any-copy.html" data-feature-link="anyCopy"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="image-download.html" data-feature-link="imageDownload"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="video-download.html" data-feature-link="videoDownload"><span aria-hidden="true"></span></a>
        <a class="feature-link active" href="satellites.html" data-feature-link="satellites"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="all-settings.html" data-feature-link="allSettings"><span aria-hidden="true"></span></a>
      </nav>
    </div>
  </header>
  <main class="layout">
    <div class="primary">
      <section class="card">
        <div class="intro-title"><span data-section-icon="satellites" aria-hidden="true"></span><h1 data-i18n="satellitesName"></h1></div>
        <p class="last" data-i18n="satellitesOverviewHelp"></p>
      </section>
      <section class="card satellite-card">
        <div class="section-heading">
          <div><h1 data-i18n="mailtoCaptureName"></h1><p data-i18n="mailtoCaptureDescription"></p></div>
          <div class="satellite-control"><label class="switch"><input id="mailtoCaptureEnabled" type="checkbox" checked><span></span><b class="sr-only">Mailto Capture</b></label></div>
        </div>
        <div class="satellite-privacy"><strong data-i18n="biliDailyLoginPrivacyHeading"></strong><p data-i18n="mailtoCapturePrivacy"></p></div>
      </section>
      <section class="card satellite-card page-display-card">
        <div class="section-heading">
          <div><h1 data-i18n="pageDisplayName"></h1><p data-i18n="pageDisplayDescription"></p></div>
        </div>
        <div class="preference-list satellite-preferences">
          <label class="preference-row" for="pageDisplayReduceWhitePointEnabled"><span><strong data-i18n="reduceWhitePointName"></strong><small data-i18n="reduceWhitePointHelp"></small></span><span class="switch"><input id="pageDisplayReduceWhitePointEnabled" type="checkbox"><span></span></span></label>
          <label class="preference-row" for="reduceWhitePointReduction"><span><strong data-i18n="reduceWhitePointReductionHeading"></strong><small data-i18n="reduceWhitePointReductionHelp"></small></span><span class="range-control"><input id="reduceWhitePointReduction" type="range" min="10" max="80" step="5" value="25"><output id="reduceWhitePointReductionValue" for="reduceWhitePointReduction">25%</output></span></label>
          <label class="preference-row" for="pageDisplayGreyscaleEnabled"><span><strong data-i18n="greyscaleName"></strong><small data-i18n="greyscaleHelp"></small></span><span class="switch"><input id="pageDisplayGreyscaleEnabled" type="checkbox"><span></span></span></label>
        </div>
        <div class="satellite-privacy"><strong data-i18n="biliDailyLoginPrivacyHeading"></strong><p data-i18n="pageDisplayPrivacy"></p></div>
      </section>
      <section class="card satellite-card xhs-dark-reader-card">
        <div class="section-heading">
          <div><h1 data-i18n="xhsImageDarkModeName"></h1><p data-i18n="xhsImageDarkModeDescription"></p></div>
          <div class="satellite-control"><label class="switch"><input id="xhsImageDarkModeEnabled" type="checkbox"><span></span><b class="sr-only">XHS Image Dark Mode</b></label></div>
        </div>
        <div class="preference-list satellite-preferences">
          <label class="preference-row" for="xhsImageDarkModeOverride"><span><strong data-i18n="xhsImageDarkModeOverrideHeading"></strong><small data-i18n="xhsImageDarkModeOverrideHelp"></small></span><span class="switch"><input id="xhsImageDarkModeOverride" type="checkbox"><span></span></span></label>
          <label class="preference-row" for="xhsImageDarkModeControl"><span><strong data-i18n="xhsImageDarkModeControlHeading"></strong><small data-i18n="xhsImageDarkModeControlHelp"></small></span><span class="switch"><input id="xhsImageDarkModeControl" type="checkbox" checked><span></span></span></label>
          <label class="preference-row xhs-opacity-row" for="xhsImageDarkModeOpacity"><span><strong data-i18n="xhsImageDarkModeOpacityHeading"></strong><small data-i18n="xhsImageDarkModeOpacityHelp"></small></span><span class="range-control"><input id="xhsImageDarkModeOpacity" type="range" min="20" max="90" step="5" value="50"><output id="xhsImageDarkModeOpacityValue" for="xhsImageDarkModeOpacity">50%</output></span></label>
        </div>
        <div class="satellite-privacy"><strong data-i18n="biliDailyLoginPrivacyHeading"></strong><p data-i18n="xhsImageDarkModePrivacy"></p></div>
      </section>
      <section class="card satellite-card">
        <div class="section-heading">
          <div><h1 data-i18n="biliDailyLoginName"></h1><p data-i18n="biliDailyLoginDescription"></p></div>
          <div class="satellite-control"><label class="switch"><input id="biliDailyLogin" type="checkbox"><span></span><b class="sr-only">Bili Daily Login</b></label><span class="incognito-status" data-i18n="disabledInIncognito" hidden></span></div>
        </div>
        <div class="satellite-privacy"><strong data-i18n="biliDailyLoginPrivacyHeading"></strong><p data-i18n="biliDailyLoginPrivacy"></p></div>
      </section>
      <section class="card satellite-card">
        <div class="section-heading">
          <div><h1 data-i18n="adMarshalName"></h1><p data-i18n="adMarshalDescription"></p></div>
        </div>
        <fieldset class="ad-marshal-sites">
          <legend data-i18n="adMarshalManagedSitesHeading"></legend>
          <div class="ad-marshal-site-grid">
            <label><input id="adMarshalTencentNews" data-ad-marshal-site="tencentNews" type="checkbox"><span data-i18n="adMarshalTencentNews"></span></label>
            <label><input id="adMarshalDouyin" data-ad-marshal-site="douyin" type="checkbox"><span data-i18n="adMarshalDouyin"></span></label>
            <label><input id="adMarshalZhihu" data-ad-marshal-site="zhihu" type="checkbox"><span data-i18n="adMarshalZhihu"></span></label>
            <label><input id="adMarshalGmail" data-ad-marshal-site="gmail" type="checkbox"><span data-i18n="adMarshalGmail"></span></label>
          </div>
        </fieldset>
        <div class="satellite-privacy"><strong data-i18n="biliDailyLoginPrivacyHeading"></strong><p data-i18n="adMarshalPrivacy"></p></div>
      </section>
    </div>
    <div class="sidebar">
      <aside class="help card">
        <h2 data-i18n="satellitesHelpHeading"></h2>
        <p data-i18n="satellitesHelpIntro"></p>
      </aside>
      <section class="card compact language-card">
        <label for="language"><strong data-i18n="languageHeading"></strong></label>
        <select id="language"><option value="en-US" data-i18n="english"></option><option value="zh-CN" data-i18n="chinese"></option></select>
      </section>
    </div>
  </main>
  <footer><span id="version"></span><span>© 2026 Songming.org</span></footer>
  <script src="preload.js"></script>
  <script type="module" src="page.js"></script>
</body>
</html>
