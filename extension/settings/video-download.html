<!doctype html>
<html lang="en-US" data-locale-pending="true">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cosmic Gemini · Video Download</title>
  <script src="../shared/localization-data.js"></script>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body data-feature="videoDownload">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="product-identity">
        <span class="brand-mark" aria-hidden="true"><img class="brand-icon" src="../icons/icon-128.png" alt=""></span>
        <div class="wordmark"><strong>Video Download</strong><span><em>at</em> Cosmic Gemini</span></div>
      </div>
      <nav class="feature-switch" aria-label="Cosmic Gemini">
        <a class="feature-link" href="native-scroll.html" data-feature-link="nativeScroll"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="no-autoplay.html" data-feature-link="noAutoplay"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="any-copy.html" data-feature-link="anyCopy"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="image-download.html" data-feature-link="imageDownload"><span aria-hidden="true"></span></a>
        <a class="feature-link active" href="video-download.html" data-feature-link="videoDownload"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="satellites.html" data-feature-link="satellites"><span aria-hidden="true"></span></a>
        <a class="feature-link" href="all-settings.html" data-feature-link="allSettings"><span aria-hidden="true"></span></a>
      </nav>
    </div>
  </header>
  <main class="layout">
    <div class="primary">
      <section class="card">
        <div class="section-heading">
          <div><div class="intro-title"><span data-section-icon="videoDownload" aria-hidden="true"></span><h1 data-i18n="videoDownloadName"></h1></div><p data-i18n="videoDownloadActivationHelp"></p></div>
          <span class="context-label" data-i18n="clickToEnableLabel"></span>
        </div>
      </section>
      <section class="card">
        <h2 data-i18n="videoDownloadPreferencesHeading"></h2>
        <p data-i18n="videoDownloadPreferencesHelp"></p>
        <div class="preference-list">
          <label class="preference-row" for="preferredQuality"><span><strong data-i18n="preferredQualityHeading"></strong><small data-i18n="preferredQualityHelp"></small></span><select id="preferredQuality"><option value="best" data-i18n="qualityBest"></option><option value="2160">2160p</option><option value="1440">1440p</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option></select></label>
          <label class="preference-row" for="askWhereToSave"><span><strong data-i18n="askWhereToSaveHeading"></strong><small data-i18n="askWhereToSaveHelp"></small></span><span class="switch"><input id="askWhereToSave" type="checkbox" checked><span></span></span></label>
        </div>
      </section>
    </div>
    <div class="sidebar">
      <aside class="help card">
        <h2 data-i18n="helpHeading"></h2>
        <p data-i18n="videoDownloadHelpDetection"></p><p data-i18n="videoDownloadHelpFormats"></p><p data-i18n="videoDownloadHelpSession"></p>
        <hr><h2 data-i18n="privacyHeading"></h2><p data-i18n="videoDownloadPrivacy"></p>
      </aside>
      <section class="card compact language-card">
        <label for="language"><strong data-i18n="languageHeading"></strong></label>
        <select id="language"><option value="en-US" data-i18n="english"></option><option value="zh-CN" data-i18n="chinese"></option></select>
      </section>
    </div>
  </main>
  <footer><span id="version"></span><span>© 2026 Songming.org</span></footer>
  <script src="preload.js"></script>
  <script type="module" src="page.js"></script>
</body>
</html>
