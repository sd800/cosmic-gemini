<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8"><meta name="darkreader-lock">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-src 'self' blob:; object-src 'self' blob:; connect-src blob:">
  <title>Document Preview · Cosmic Gemini</title>
  <script src="appearance-hint.js"></script>
  <link rel="stylesheet" href="../../shared/ui.css">
  <link rel="stylesheet" href="document-preview.css">
  <link rel="stylesheet" href="../pdf-viewer/appearance-menu.css">
</head>
<body>
  <header class="document-toolbar notranslate" translate="no">
    <div class="document-info">
      <h1><button id="filename" type="button" aria-haspopup="dialog" aria-controls="properties-dialog" disabled></button></h1>
      <button id="metadata" type="button" aria-haspopup="dialog" aria-controls="properties-dialog" disabled></button>
    </div>
    <nav class="toolbar-actions">
      <div id="part-controls" hidden><button id="part-previous" type="button">‹</button><label id="part-label" for="document-part"></label><select id="document-part"></select><button id="part-next" type="button">›</button></div>
      <div class="reading-controls">
        <button id="email-language" type="button" hidden></button>
        <div id="zoom-controls" class="zoom-controls" role="group" data-i18n-aria-label="documentZoom" hidden>
          <button id="zoom-out" type="button" data-i18n-aria-label="documentZoomOut">−</button>
          <button id="zoom-reset" type="button" data-i18n-aria-label="documentZoomReset">100%</button>
          <button id="zoom-in" type="button" data-i18n-aria-label="documentZoomIn">+</button>
        </div>
      </div>
      <button id="theme-auto" type="button" data-i18n="documentThemeAuto" hidden></button>
      <button id="theme-toggle" class="theme-toggle" type="button"></button>
      <button id="download" class="primary-button" type="button" data-i18n="documentDownloadAction" disabled></button>
    </nav>
    <div id="loading-progress" role="progressbar" data-i18n-aria-label="documentLoading"><span></span></div>
    <div class="document-feedback">
      <p id="layout-note" hidden></p>
      <p id="status" role="status" data-i18n="documentLoading"></p>
      <div id="choice" hidden>
        <label><input id="remember" type="checkbox"><span data-i18n="documentRemember"></span></label>
        <div class="choice-actions"><button id="preview" class="primary-button" type="button" data-i18n="documentPreviewAction"></button><button id="choice-download" class="secondary-button" type="button" data-i18n="documentDownloadAction"></button></div>
      </div>
    </div>
  </header>
  <main>
    <iframe id="document" title="Document content" sandbox="allow-scripts allow-modals allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer" hidden></iframe>
  </main>
  <div id="appearance-menu" class="notranslate" translate="no" popover="auto" role="menu" tabindex="-1"></div>
  <dialog id="properties-dialog" class="notranslate" translate="no" aria-labelledby="properties-title">
    <h2 id="properties-title" tabindex="-1"></h2><p id="properties-status" role="status"></p><dl id="properties-list"></dl>
    <div class="dialog-actions"><button id="properties-close" type="button"></button></div>
  </dialog>
  <script type="module" src="document-preview.js"></script>
</body>
</html>
